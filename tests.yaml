- name: '[Return Types] Each return type returns the matching value'
  code: |-
    [
      ['decision', 'limited', 'allow'],
      ['restricted', true, false],
      ['metaDpo', ['LDU'], []],
      ['metaDpoCountry', 0, undefined],
      ['metaDpoState', 0, undefined],
      ['googleAdsRdp', true, false],
      ['tiktokLdu', true, false]
    ].forEach((c) => {
